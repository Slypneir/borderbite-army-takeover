<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- The SDK comes before the game code -->
    <script src="/sdk.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1a1f29;
        touch-action: none; -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game-stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
      #game-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #game-loading { position: absolute; left: 20%; right: 20%; top: 50%; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
      #game-progress { width: 0; height: 100%; background: #f5f5eb; }
    </style>
  </head>
  <body>
    <div id="game-stage">
      <canvas id="game-canvas" tabindex="-1"></canvas>
      <div id="game-loading"><div id="game-progress"></div></div>
    </div>
    <script>
      var canvas = document.querySelector("#game-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (message, type) { (type === "error" ? console.error : console.warn)(message); },
      };
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      // the long side of the field is at most twice the short one (requirements 1.6.2.1, 1.6.2.2); the rest stays empty
      var stage = document.querySelector("#game-stage");
      function fitStage() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        var fitWidth = Math.min(width, height * 2);
        var fitHeight = Math.min(height, width * 2);
        stage.style.width = fitWidth + "px";
        stage.style.height = fitHeight + "px";
        stage.style.left = (width - fitWidth) / 2 + "px";
        stage.style.top = (height - fitHeight) / 2 + "px";
      }
      window.addEventListener("resize", fitStage);
      fitStage();

      var loader = document.createElement("script");
      loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      loader.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#game-progress").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#game-loading").style.display = "none";
        }).catch(function (message) {
          console.error(message);
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
